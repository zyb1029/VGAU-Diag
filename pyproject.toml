[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgau-diag"
version = "0.1.0"
description = "Difficulty-aware evaluation for visual generation-assisted understanding"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Yubo Zhu" },
  { name = "Zhehan Kan" },
  { name = "Jingyi Yang" },
  { name = "Miaolin Chen" },
  { name = "Jinbo Xing" },
  { name = "Kai Zhu" },
  { name = "Zijian Wang" },
  { name = "Sheng Zhong" },
  { name = "Wei Tong" },
]
dependencies = [
  "accelerate>=0.29.1",
  "aiohttp>=3.9",
  "datasets>=2.19.0",
  "dill>=0.3.8",
  "huggingface-hub>=0.23.0",
  "jinja2>=3.1",
  "loguru>=0.7",
  "numpy>=1.26.4,<2",
  "packaging>=24.0",
  "pandas>=2.1",
  "pillow>=10.0",
  "pydantic>=2.0",
  "pytablewriter>=1.2",
  "pytz>=2024.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "sacrebleu>=2.4",
  "sqlitedict>=2.1",
  "tenacity>=8.3",
  "torch>=2.1.0",
  "tqdm>=4.66",
  "transformers>=4.39.2",
]

[project.optional-dependencies]
judge = ["sglang>=0.4"]
metrics = ["evaluate>=0.4"]
tracking = ["wandb>=0.16"]
dev = ["ruff>=0.8"]

[project.scripts]
vgau-eval = "lmms_eval.__main__:cli_evaluate"

[project.urls]
Paper = "https://arxiv.org/abs/2608.22174"
Repository = "https://github.com/zyb1029/VGAU-Diag"

[tool.setuptools.package-data]
lmms_eval = ["tasks/**/*.yaml", "tasks/**/*.yml"]

[tool.setuptools.packages.find]
include = ["lmms_eval*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
