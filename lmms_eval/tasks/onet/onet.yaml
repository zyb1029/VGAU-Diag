dataset_path: json
dataset_kwargs:
  data_files: ./data/onet/dataset_manifest.json
task: "onet"
test_split: train
output_type: generate_until

doc_to_visual: !function utils.onet_doc_to_visual
doc_to_text: !function utils.onet_doc_to_text
doc_to_target: "answer"

process_results: !function utils.onet_process_results

generation_kwargs:
  max_new_tokens: 8192
  do_sample: false
  temperature: 0.0
  until:
    - "</answer_json>"

lmms_eval_specific_kwargs:
  default:
    onet_prompt_mode: aux_cot
    onet_image_root: ./data/onet

metric_list:
  - metric: onet_acc_easy
    aggregation: !function utils.onet_agg_acc_easy
    higher_is_better: true
  - metric: onet_acc_middle
    aggregation: !function utils.onet_agg_acc_middle
    higher_is_better: true
  - metric: onet_acc_hard
    aggregation: !function utils.onet_agg_acc_hard
    higher_is_better: true
  - metric: onet_acc_overall
    aggregation: !function utils.onet_agg_acc_overall
    higher_is_better: true

metadata:
  version: 1.0
  num_samples: 100
